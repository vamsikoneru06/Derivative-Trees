<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz · Derivation Tree Explorer</title>
    <meta name="description" content="Check your understanding of derivations, derivation trees and ambiguity.">
    <script>try{var t=localStorage.getItem('dte-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <script type="module" src="js/ui/theme.js"></script>
    <script type="module" src="js/ui/mobile-shell.js"></script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/tree.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/mobile.css">
    <script type="module" src="js/pages/quiz.js"></script>
    <script type="module" src="js/pages/quiz-mobile.js"></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
        <a class="brand" href="index.html">
            <svg viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="5" r="4" fill="var(--ink)"/><circle cx="5" cy="17" r="3.4" fill="none" stroke="var(--tree-t)" stroke-width="1.6"/><circle cx="17" cy="17" r="3.4" fill="var(--tree-active)"/><path d="M9.2 8.4 6.4 14M12.8 8.4l2.8 5.6" stroke="var(--ink-3)" stroke-width="1.4"/></svg>
            Derivation Tree Explorer
        </a>
        <nav class="site-nav" aria-label="Main">
            <a href="index.html">Home</a>
            <a href="visualizer.html">Visualizer</a>
            <a href="ambiguity.html">Ambiguity</a>
            <a href="learn.html">Learn</a>
            <a href="quiz.html" aria-current="page">Quiz</a>
            <a href="team.html">Team</a>
        </nav>
        <div class="theme-toggle" role="group" aria-label="Colour theme">
            <span class="theme-toggle__thumb" aria-hidden="true"></span>
            <button type="button" data-theme-set="light">Light</button>
            <button type="button" data-theme-set="dark">Dark</button>
        </div>
    </header>

    <main id="main" class="d-only page narrow">
        <h1>Quiz</h1>
        <div class="row" style="justify-content: space-between; margin-bottom: var(--space-3)">
            <span id="progress" class="hint"></span>
            <span id="score" class="badge badge--info"></span>
        </div>
        <div class="toc__progress" aria-hidden="true"><span id="bar"></span></div>
        <section class="card" aria-live="polite">
            <h2 id="question" style="font-size: var(--text-l)"></h2>
            <ul id="options" class="choices"></ul>
            <p id="explain" class="hint" style="margin-top: var(--space-4)"></p>
            <div class="row" style="justify-content: flex-end">
                <button id="next" class="btn btn--primary" type="button" hidden>Next question</button>
            </div>
        </section>
    </main>
    <main id="main-m" class="m-only">
        <div class="m-page quiz-m">
            <section id="qm-intro" class="quiz-m-view">
                <div class="m-intro">
                    <h1>Quiz</h1>
                    <p>10 questions. Some ask you to read a tree, some ask you to build one by picking productions.</p>
                </div>
                <div class="m-stage m-stage--framed quiz-m-hero"><svg id="qm-intro-tree" aria-hidden="true"></svg></div>
                <div class="quiz-m-facts">
                    <div><b>10</b><span>questions</span></div>
                    <div><b>4</b><span>build a tree</span></div>
                    <div><b>6</b><span>choose one</span></div>
                </div>
                <button type="button" class="m-btn m-btn--primary quiz-m-big" data-qm="start">Start quiz</button>
            </section>

            <section id="qm-question" class="quiz-m-view" hidden>
                <div class="quiz-m-progress">
                    <div class="quiz-m-progress__top"><b id="qm-num"></b><span id="qm-score"></span></div>
                    <div id="qm-bar" class="quiz-m-bar"></div>
                </div>
                <div class="quiz-m-q">
                    <span id="qm-kicker" class="m-kicker"></span>
                    <h2 id="qm-text"></h2>
                    <span id="qm-grammar" class="quiz-m-grammar"></span>
                </div>
                <div id="qm-stage" class="m-stage m-stage--framed quiz-m-stage"><svg id="qm-tree" aria-hidden="true"></svg></div>
                <span id="qm-prompt" class="quiz-m-prompt"></span>
                <div id="qm-options" class="quiz-m-options"></div>
                <p id="qm-feedback" class="m-note" aria-live="polite"></p>
                <button type="button" class="m-btn m-btn--primary quiz-m-big" data-qm="next" disabled>Next question</button>
            </section>

            <section id="qm-done" class="quiz-m-view" hidden>
                <div class="quiz-m-result">
                    <span class="quiz-m-result__k">Quiz finished</span>
                    <span class="quiz-m-result__score"><span id="qm-final"></span><span>/10</span></span>
                    <span id="qm-msg" class="quiz-m-result__msg"></span>
                </div>
                <div id="qm-review" class="m-card m-card--s quiz-m-review"></div>
                <div class="m-btn-row">
                    <a class="m-btn quiz-m-link" href="learn.html">Review lessons</a>
                    <button type="button" class="m-btn m-btn--primary" data-qm="start">Try again</button>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
