        </div>

        <section class="card" aria-live="polite">
            <h2 id="question" style="font-size: var(--text-l)"></h2>
            <ul id="options" class="choices"></ul>
            <p id="explain" class="hint" style="margin-top: var(--space-4)"></p>
            <div class="row" style="justify-content: flex-end">
                <button id="next" class="btn btn--primary" type="button" hidden>Next question</button>
